name: Laravel Boot Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    name: Boot Laravel for Artisan validation
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Laravel Artisan runtime
        uses: ./.github/actions/setup-laravel-artisan

      - name: Check required production secrets
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          missing=()

          for name in APP_KEY DB_HOST DB_PORT DB_DATABASE DB_USERNAME DB_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Prove Laravel boots
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          BROADCAST_CONNECTION: log
          FILESYSTEM_DISK: local
          MAIL_MAILER: log
        run: php artisan about --only=environment

      - name: Prove database connection
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
          APP_URL: ${{ vars.APP_URL }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_CONNECTION: pgsql
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          SESSION_DRIVER: database
          CACHE_STORE: database
          QUEUE_CONNECTION: database
          BROADCAST_CONNECTION: log
          FILESYSTEM_DISK: local
          MAIL_MAILER: log
        run: php artisan migrate:status --no-interaction
