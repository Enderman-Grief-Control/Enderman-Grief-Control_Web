name: Laravel Boot Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    name: Boot Laravel for Artisan validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Laravel Artisan runtime
        uses: ./.github/actions/setup-laravel-artisan
        with:
          app-key: ${{ secrets.APP_KEY }}
          app-url: ${{ vars.APP_URL }}
          db-host: ${{ secrets.DB_HOST }}
          db-port: ${{ secrets.DB_PORT }}
          db-database: ${{ secrets.DB_DATABASE }}
          db-username: ${{ secrets.DB_USERNAME }}
          db-password: ${{ secrets.DB_PASSWORD }}

      - name: Prove Laravel boots
        run: php artisan about --only=environment

      - name: Prove database connection
        run: php artisan migrate:status --no-interaction
