services:
    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        ports:
            - '${DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE:-enderman_grief_control}'
            POSTGRES_USER: '${DB_USERNAME:-postgres}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - egc-postgres-data:/var/lib/postgresql/data

volumes:
    egc-postgres-data:
